<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Current Questions — Boonstra Quiz</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 16px; }
    .card { padding: 24px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 16px; }
    button { padding: 8px 12px; margin-right: 8px; margin-bottom: 8px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 8px; border: 1px solid #eee; text-align: left; }
    .question { margin-bottom: 20px; padding: 16px; border: 1px solid #eee; border-radius: 8px; }
    .question h3 { margin-top: 0; color: #333; }
    .question-options { margin: 12px 0; }
    .question-options label { display: block; margin: 8px 0; padding: 8px; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; }
    .question-options label:hover { background-color: #f5f5f5; }
    .question-options input[type="radio"] { margin-right: 8px; }
    .question-options input[type="text"] { width: 100%; padding: 8px; margin-top: 8px; box-sizing: border-box; }
    .question-image { max-width: 100%; height: auto; margin: 12px 0; border-radius: 4px; }
    .submit-answer { background-color: #007bff; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
    .submit-answer:hover { background-color: #0056b3; }
    .submit-answer:disabled { background-color: #ccc; cursor: not-allowed; }
    .correct-answer { background-color: #d4edda; border-color: #c3e6cb; }
    .incorrect-answer { background-color: #f8d7da; border-color: #f5c6cb; }
    .page-title { color: #333; margin-bottom: 20px; }
    .loading { text-align: center; color: #666; }

  </style>
</head>
<body>
  <div class="card">
    <h1 id="greeting">Hello</h1>
    <div id="questionArea">
      <div id="pageTitle" class="page-title"></div>
      <div id="questionsContainer">
        <div class="loading">Loading questions...</div>
      </div>
    </div>

    <div style="margin-top: 18px;">
      <button id="adminBtn">Admin Console</button>
      <button id="signOut">Sign out</button>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    (async function() {
      const raw = localStorage.getItem('boonstra-current-user');
      if (!raw) {
        window.location.href = './index.html';
        return;
      }
      let user;
      try {
        user = JSON.parse(raw);
      } catch (_) {
        user = null;
      }
      const displayName = (user && user.name) ? user.name : 'Guest';
      document.getElementById('greeting').textContent = 'Hello, ' + displayName;

      let currentPageId = null;
      let pollInterval = null;
      let timeUntilNextPoll = 0;
      let timeUpdateInterval = null;
      let pollingStarted = false; // Add this flag to prevent duplicate polling

      const pages = await window.Boonstra.getAllQuestionPages();
      // store the resolved user object
      localStorage.setItem('boonstra-question-pages', JSON.stringify(pages));

      function renderQuestionPage(page) {
        if (!page) {
          document.getElementById('pageTitle').textContent = 'No active question page';
          document.getElementById('questionsContainer').innerHTML = '<div class="loading">No questions available</div>';
          return;
        }

        document.getElementById('pageTitle').textContent = page.title;
        
        let html = '';
        page.questions.forEach((question, index) => {
          html += `<div class="question" data-question-id="${question.id}">`;
          html += `<h3>Question ${index + 1}</h3>`;
          html += `<p>${question.text}</p>`;
          
          if (question.type === 'multiple-choice') {
            html += '<div class="question-options">';
            question.options.forEach((option, optIndex) => {
              html += `<label><input type="radio" name="q_${question.id}" value="${optIndex}"> ${option}</label>`;
            });
            html += '</div>';
          } else if (question.type === 'open') {
            html += `<div class="question-options">`;
            html += `<input type="text" name="q_${question.id}" placeholder="Your answer">`;
            html += `</div>`;
          }
          
          html += `<button class="submit-answer" onclick="submitAnswer('${question.id}', '${user.id || user.name}')">Submit Answer</button>`;
          html += '</div>';
        });
        
        document.getElementById('questionsContainer').innerHTML = html;
      }

      function updatePollingStatus(canPoll, activatedAt, minTimeMinutes) {
        
        if (!canPoll && activatedAt) {
          const activatedTime = new Date(activatedAt).getTime();
          const currentTime = new Date().getTime();
          const timeDiffMinutes = (currentTime - activatedAt) / (1000 * 60);
          const remainingMinutes = Math.max(0, minTimeMinutes - timeDiffMinutes);
          
          if (remainingMinutes > 0) {
            const remainingSeconds = Math.ceil(remainingMinutes * 60);
            
            // Update countdown every second
            timeUntilNextPoll = remainingSeconds;
            if (timeUpdateInterval) clearInterval(timeUpdateInterval);
            timeUpdateInterval = setInterval(() => {
              timeUntilNextPoll--;
              if (timeUntilNextPoll <= 0) {
                clearInterval(timeUpdateInterval);
                timeUpdateInterval = null;
                // Start polling when countdown reaches zero
                if (!pollInterval) {
                  pollInterval = setInterval(loadCurrentQuestionPage, 5000);
                }
              } 
            }, 1000);
          } else {
            // No wait time needed, start polling immediately
            if (!pollInterval) {
              pollInterval = setInterval(loadCurrentQuestionPage, 5000);
            }
          }
        } else {
          if (timeUpdateInterval) {
            clearInterval(timeUpdateInterval);
            timeUpdateInterval = null;
          }
          // Start polling immediately if canPoll is true
          if (canPoll && !pollInterval) {
            pollInterval = setInterval(loadCurrentQuestionPage, 5000);
          }
        }
      }

      async function loadCurrentQuestionPage() {
        try {
          
          const response = await window.Boonstra.getCurrentQuestionPageId();
          const currentQuestionPageId = response.currentQuestionPageId;
          const activatedAt = response.activatedAt;
          
          if (currentQuestionPageId && currentQuestionPageId !== currentPageId) {
            currentPageId = page.id;
            const raw = localStorage.getItem('boonstra-question-pages');
            const pages = JSON.parse(raw);
            const page = pages.find(p => p.id === response.currentQuestionPageId);
            renderQuestionPage(page);
            updatePollingStatus(false, activatedAt, page.minTimeMinutes || 3);
          } else if (!page) {
            document.getElementById('pageTitle').textContent = 'No active question page';
            document.getElementById('questionsContainer').innerHTML = '<div class="loading">No questions available</div>';
            updatePollingStatus(true, null, 0);
          } 
        } catch (err) {
          console.error('Error loading question page:', err);
          document.getElementById('pageTitle').textContent = 'Error loading questions';
          document.getElementById('questionsContainer').innerHTML = '<div class="loading">Unable to load questions</div>';
          updatePollingStatus(true, null, 0);
        }
      }

      // Load initial question page
      await loadCurrentQuestionPage();


      // Clean up polling when page is unloaded
      window.addEventListener('beforeunload', () => {
        if (pollInterval) {
          clearInterval(pollInterval);
        }
        if (timeUpdateInterval) {
          clearInterval(timeUpdateInterval);
        }
      });

      document.getElementById('adminBtn').addEventListener('click', () => {
        window.location.href = './admin.html';
      });

      document.getElementById('signOut').addEventListener('click', () => {
        localStorage.removeItem('boonstra-current-user');
        window.location.href = './index.html';
      });
    })();

    // Global function for submitting answers
    async function submitAnswer(questionId, userId) {
      const questionElement = document.querySelector(`[data-question-id="${questionId}"]`);
      const submitBtn = questionElement.querySelector('.submit-answer');
      
      // Disable the button to prevent multiple submissions
      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting...';

      try {
        // Get the answer
        let answer = null;
        const radioInputs = questionElement.querySelectorAll('input[type="radio"]');
        const textInput = questionElement.querySelector('input[type="text"]');
        
        if (radioInputs.length > 0) {
          const selected = questionElement.querySelector('input[type="radio"]:checked');
          answer = selected ? parseInt(selected.value) : null;
        } else if (textInput) {
          answer = textInput.value.trim();
        }

        if (answer === null || answer === '') {
          alert('Please provide an answer');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Submit Answer';
          return;
        }

        // For now, just increment score (in a real implementation, you'd validate the answer)
        await window.Boonstra.incrementScore({ id: userId, amount: 1 });
        
        // Show success feedback
        submitBtn.textContent = 'Answer Submitted!';
        submitBtn.style.backgroundColor = '#28a745';
        
        // Disable the question to prevent re-submission
        const inputs = questionElement.querySelectorAll('input');
        inputs.forEach(input => input.disabled = true);
        
      } catch (err) {
        console.error('Error submitting answer:', err);
        alert('Error submitting answer: ' + err.message);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit Answer';
      }
    }
  </script>
</body>
</html>
